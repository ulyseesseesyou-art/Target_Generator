<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Target Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="max-w-4xl mx-auto p-8">
    <h1 class="text-3xl font-bold mb-6">🎯 Target Generator</h1>

    <form method="POST" action="/generate" class="space-y-4 bg-white p-6 rounded-xl shadow">
      <label class="block">
        <span class="font-semibold">Number of Rows</span>
        <input type="number" name="rows" class="border p-2 rounded w-full" value="5">
      </label>

      <label class="block">
        <span class="font-semibold">Number of Columns</span>
        <input type="number" name="cols" class="border p-2 rounded w-full" value="6">
      </label>

      <label class="block">
        <span class="font-semibold">Circle Diameter (mm)</span>
        <input type="number" name="diameter" class="border p-2 rounded w-full" value="20">
      </label>

      <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
        Generate PDF
      </button>
    </form>
  </div>
</body>
</html>
